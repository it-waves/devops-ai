<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;margin:0;font-family:DejaVu Sans,Arial,sans-serif}
body{background:#f4f6fb;color:#16202c}
header{background:#2f6fed;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:26px}.ver{background:rgba(255,255,255,.2);border-radius:20px;padding:6px 16px;font-weight:700;font-size:20px}
.banner{background:#000;color:#fff;padding:12px 24px;font-size:19px;font-weight:700;display:none}
main{padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px #0002}.card b{display:block;font-size:18px}.card span{color:#556;font-size:15px}
.img{height:70px;border-radius:10px;background:#2f6fed;opacity:.25;margin-bottom:10px}
</style></head><body><header><h1>Pocket Shop</h1><div class="ver">v1</div></header>
<div class="banner"></div>
<main><div class="card"><div class="img"></div><b>Coffee beans</b><span>$12</span></div><div class="card"><div class="img"></div><b>Tea sampler</b><span>$9</span></div><div class="card"><div class="img"></div><b>Mug</b><span>$7</span></div></main></body></html>
